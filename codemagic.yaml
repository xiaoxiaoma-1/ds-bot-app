# Codemagic CI/CD 配置 —— ds-bot-app unsigned ipa 备用构建线
#
# 用途：GitHub Actions 的 macOS runner 池拿不到机器时的 Plan B。
# 产出与 GitHub Actions 那条线完全同构：未签名 ipa（供 iloader / SideStore 自行签名装机）。
#
# 关键约束（与 GitHub Actions 版保持一致，改动前先看这里）：
#   - 必须 Xcode 26.3：expo-modules-jsi@57.1.3 的 Package.swift 声明 swift-tools-version 6.2
#     Xcode 26.3 = Swift 6.2.4，满足；Xcode 16.x 只有 Swift 6.1，会在 pod install 阶段失败。
#   - 必须 SDK 57 基线：expo 57.0.32 / RN 0.86.3 / react 19.2.3 / screens ~4.26.0
#   - 全程不配任何签名证书，CODE_SIGNING_ALLOWED=NO
#
# 免费额度：500 macOS M2 分钟/月（每月 1 日重置），单次构建约 7 分钟 ≈ 70 次/月。

workflows:
  ios-unsigned:
    name: iOS unsigned ipa
    instance_type: mac_mini_m2          # 免费档机型，500 分钟/月
    max_build_duration: 60              # 分钟；防止卡死占用额度
    environment:
      groups: []
      vars:
        XCODE_VERSION: "26.3"
        SCHEME: "DSBot"
        WORKSPACE: "DSBot.xcworkspace"
        BUNDLE_ID: "com.jinyu.dsbot"
      node: 22
      xcode: $XCODE_VERSION
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true      # 新推送顶掉排队中的旧构建
    scripts:
      - name: 打印工具链版本
        script: |
          set -e
          sw_vers || true
          uname -m || true
          node -v || true
          npm -v || true
          xcodebuild -version || true
          pod --version || true
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"

      - name: 安装依赖
        script: |
          set -e
          npm install --no-audit --no-fund

      - name: expo prebuild 生成 iOS 工程
        script: |
          set -e
          npx expo prebuild -p ios --no-install

      - name: pod install
        script: |
          set -e
          cd ios
          pod install

      - name: 选择 scheme 并免签名编译
        script: |
          set -e
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "workspace=$WORKSPACE"

          # 不盲取 schemes[0]（那是 pod 静态库，编了也不出 .app）
          # 逐个问 PRODUCT_TYPE，取 com.apple.product-type.application
          SCHEME_PICKED=""
          for s in $(xcodebuild -list -json -workspace "$WORKSPACE" 2>/dev/null \
                     | python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join((d.get('workspace') or d.get('project'))['schemes']))"); do
            T=$(xcodebuild -workspace "$WORKSPACE" -scheme "$s" -configuration Release -sdk iphoneos \
                  -showBuildSettings 2>/dev/null \
                | sed -n 's/^[[:space:]]*PRODUCT_TYPE = //p' | tr -d '"' | tail -1)
            echo "  scheme=$s PRODUCT_TYPE=${T:-<none>}"
            if [ "${T:-}" = "com.apple.product-type.application" ]; then SCHEME_PICKED="$s"; break; fi
          done
          if [ -z "$SCHEME_PICKED" ]; then echo "NO APP SCHEME FOUND"; exit 4; fi
          echo "scheme=$SCHEME_PICKED"

          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME_PICKED" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$CM_BUILD_DIR/build.log"

          # 用 build settings 算产物绝对路径，不靠猜目录名
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME_PICKED" \
            -configuration Release -sdk iphoneos -derivedDataPath "$CM_BUILD_DIR/build" \
            -showBuildSettings > "$CM_BUILD_DIR/build-settings.txt" 2>&1 || true
          TBD=$(sed -n 's/^[[:space:]]*TARGET_BUILD_DIR = //p' "$CM_BUILD_DIR/build-settings.txt" | tail -1)
          WN=$(sed -n 's/^[[:space:]]*WRAPPER_NAME = //p' "$CM_BUILD_DIR/build-settings.txt" | tail -1)
          echo "TARGET_BUILD_DIR=$TBD"
          echo "WRAPPER_NAME=$WN"
          echo "TBD=$TBD" >> "$CM_ENV"
          echo "WN=$WN" >> "$CM_ENV"

      - name: 打包 unsigned ipa
        script: |
          set -e
          APP="${TBD}/${WN}"
          if [ -z "$TBD" ] || [ -z "$WN" ] || [ ! -d "$APP" ]; then
            echo "NO APP FOUND at $APP"
            # 兜底：从 build 整棵树往下找
            APP=$(find "$CM_BUILD_DIR/build" -maxdepth 6 -type d -name '*.app' | head -1)
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then echo "NO APP FOUND (final)"; exit 2; fi
          echo "APP=$APP"

          rm -rf "$CM_BUILD_DIR/out"
          mkdir -p "$CM_BUILD_DIR/out/Payload"
          ditto "$APP" "$CM_BUILD_DIR/out/Payload/$(basename "$APP")"
          cd "$CM_BUILD_DIR/out"
          zip -qry "$CM_BUILD_DIR/ds-bot-unsigned.ipa" Payload
          ls -la "$CM_BUILD_DIR/ds-bot-unsigned.ipa"
          SIZE=$(wc -c < "$CM_BUILD_DIR/ds-bot-unsigned.ipa" | tr -d ' ')
          echo "IPA SIZE=$SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then echo "IPA TOO SMALL ($SIZE)"; exit 3; fi
          echo "IPA OK"

    artifacts:
      - build/ds-bot-unsigned.ipa          # 相对仓库根；Codemagic 界面上可直接下载
      - build/build.log
      - build/build-settings.txt
      - build/Build/Products/Release-iphoneos/*.app
      - build/Build/Products/Release-iphoneos/*.dSYM

    publishing:
      # 不发任何商店渠道，产物只走 artifacts
      email:
        recipients:
          - placeholder@example.com        # 占位，接入时填老板邮箱
        notify:
          success: true
          failure: true
